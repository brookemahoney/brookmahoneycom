<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Dizzy Dolphin">
  <title>Bizarro Dizzy Dolphin</title>
  <desc>A bizarro cute dizzy dolphin drifting in a sea of sparkle, with giant eyes and twinkling sparkles.</desc>
  <style>
    .diz-fin { animation: dizFin 3.1s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes dizFin {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-8deg); }
}
    .diz-shine { animation: dizShine 3.0s ease-in-out infinite; }
    @keyframes dizShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .diz-float { animation: dizFloat 4.1s ease-in-out infinite; }
    @keyframes dizFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-13px) rotate(0.7deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: dizTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes dizTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  diz-fin, diz-float, diz-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f2f9ff"/>
  <circle cx="200" cy="206" r="172" fill="#e0f2fe"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#aedffa" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="diz-float">
<path d="M102,246 C74,228 58,246 68,266 C78,284 96,276 102,258 Z" fill="#38bdf8" stroke="#075985" stroke-width="3" stroke-linejoin="round"/><ellipse cx="200" cy="254" rx="102" ry="58" fill="#7dd3fc" stroke="#075985" stroke-width="3"/><path d="M186,200 C192,170 212,166 220,194 Z" fill="#38bdf8" stroke="#075985" stroke-width="3" stroke-linejoin="round"/><g class="diz-fin"><ellipse cx="148" cy="292" rx="14" ry="28" transform="rotate(32 148 292)" fill="#38bdf8" stroke="#075985" stroke-width="3"/></g><g class="diz-fin" style="animation-delay:-1.1s"><ellipse cx="252" cy="292" rx="14" ry="28" transform="rotate(-32 252 292)" fill="#38bdf8" stroke="#075985" stroke-width="3"/></g><circle cx="156" cy="238" r="22" fill="#ffffff"/>
<circle cx="156" cy="238" r="13" fill="#0ea5e9"/>
<circle cx="156" cy="238" r="7" fill="#075985"/>
<circle class="diz-shine" cx="151" cy="233" r="5" fill="#ffffff"/>
<circle cx="244" cy="238" r="22" fill="#ffffff"/>
<circle cx="244" cy="238" r="13" fill="#0ea5e9"/>
<circle cx="244" cy="238" r="7" fill="#075985"/>
<circle class="diz-shine" cx="239" cy="233" r="5" fill="#ffffff"/>
<ellipse cx="128" cy="264" rx="13" ry="8" fill="#38bdf8" opacity="0.35"/>
<ellipse cx="272" cy="264" rx="13" ry="8" fill="#38bdf8" opacity="0.35"/>
<path d="M186,274 Q200,285 214,274" fill="none" stroke="#075985" stroke-width="3.5" stroke-linecap="round"/><path d="M236,268 Q252,276 268,268" fill="none" stroke="#075985" stroke-width="4" stroke-linecap="round"/>
<g transform="translate(95,88) scale(1.25)"><path class="twinkle" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#fde047"/></g><g transform="translate(318,118) scale(0.7)"><path class="twinkle d2" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ffffff"/></g>
</g>
<g transform="translate(58,78) scale(1.15)"><path class="twinkle" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ffffff"/></g>
<g transform="translate(342,82) scale(0.95)"><path class="twinkle d1" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ff9ff3"/></g>
