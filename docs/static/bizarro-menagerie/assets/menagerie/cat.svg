<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro cute chubby cat floating gently">
  <title>Bizarro Cat</title>
  <desc>A chubby lavender cat with a white star on its belly, giant eyes, and a curled tail, floating gently among sparkles.</desc>
  <style>
    .cat-float { animation: catFloat 4.2s ease-in-out infinite; }
    @keyframes catFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-13px) rotate(1.2deg); }
    }
    .tail-wag {
      transform-box: fill-box;
      transform-origin: left center;
      animation: tailWag 2.8s ease-in-out infinite;
    }
    @keyframes tailWag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-14deg); }
    }
    .belly-star {
      transform-box: fill-box;
      transform-origin: center;
      animation: bellyStar 3.2s ease-in-out infinite;
    }
    @keyframes bellyStar {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .eye-shine { animation: eyeShine 3s ease-in-out infinite; }
    @keyframes eyeShine {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .twinkle {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 2.6s ease-in-out infinite;
    }
    .twinkle.d1 { animation-delay: -0.7s; }
    .twinkle.d2 { animation-delay: -1.4s; }
    .twinkle.d3 { animation-delay: -2s; }
    .twinkle.d4 { animation-delay: -1.1s; }
    @keyframes twinkle {
      0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
      50% { transform: scale(1.1) rotate(12deg); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cat-float, .tail-wag, .belly-star, .eye-shine, .twinkle { animation: none !important; }
    }
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
  <circle cx="200" cy="206" r="172" fill="#ffe3fa"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#ffd0f4" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
  <g class="cat-float">
    <g class="tail-wag">
      <path d="M292,286 C338,278 348,232 318,214 C306,206 296,216 302,228 C312,248 314,262 296,268 Z" fill="#c8a2ff"/>
    </g>
    <path d="M122,158 C104,108 112,62 140,60 C168,58 182,98 178,134 Z" fill="#c8a2ff"/>
    <path d="M132,142 C122,114 126,84 142,82 C158,80 166,102 164,124 Z" fill="#f368e0"/>
    <path d="M278,158 C296,108 288,62 260,60 C232,58 218,98 222,134 Z" fill="#c8a2ff"/>
    <path d="M268,142 C278,114 274,84 258,82 C242,80 234,102 236,124 Z" fill="#f368e0"/>
    <ellipse cx="200" cy="240" rx="126" ry="104" fill="#c8a2ff"/>
    <ellipse cx="200" cy="252" rx="88" ry="72" fill="#e9d5ff"/>
    <path class="belly-star" d="M200,222 L207,240 L226,241 L211,253 L216,272 L200,262 L184,272 L189,253 L174,241 L193,240 Z" fill="#ffffff"/>
    <path d="M150,196 C162,176 186,176 194,194 C200,208 190,224 172,220 C158,217 146,208 150,196 Z" fill="#f368e0" opacity="0.3"/>
    <path d="M250,196 C238,176 214,176 206,194 C200,208 210,224 228,220 C242,217 254,208 250,196 Z" fill="#f368e0" opacity="0.3"/>
    <circle cx="152" cy="214" r="32" fill="#ffffff"/>
    <circle cx="248" cy="214" r="32" fill="#ffffff"/>
    <circle cx="155" cy="218" r="18" fill="#8b5cf6"/>
    <circle cx="245" cy="218" r="18" fill="#8b5cf6"/>
    <circle cx="155" cy="218" r="8.5" fill="#5b21b6"/>
    <circle cx="245" cy="218" r="8.5" fill="#5b21b6"/>
    <circle class="eye-shine" cx="147" cy="208" r="6.5" fill="#ffffff"/>
    <circle class="eye-shine" cx="237" cy="208" r="6.5" fill="#ffffff"/>
    <path d="M193,248 Q200,243 207,248 Q204,257 200,258 Q196,257 193,248 Z" fill="#f368e0"/>
    <path d="M187,264 Q194,270 200,265 Q206,270 213,264" fill="none" stroke="#5b21b6" stroke-width="3.5" stroke-linecap="round"/>
    <g fill="none" stroke="#5b21b6" stroke-width="2.5" stroke-linecap="round" opacity="0.35">
      <path d="M92,232 L56,224"/>
      <path d="M94,246 L58,248"/>
      <path d="M92,260 L60,270"/>
      <path d="M308,232 L344,224"/>
      <path d="M306,246 L342,248"/>
