<circle cx="148" cy="212" r="27" fill="#ffffff"/>
<circle cx="148" cy="212" r="16" fill="#0ea5e9"/>
<circle cx="148" cy="212" r="8" fill="#075985"/>
<circle class="tur-shine" cx="142" cy="206" r="5.5" fill="#ffffff"/>
<circle cx="252" cy="212" r="27" fill="#ffffff"/>
<circle cx="252" cy="212" r="16" fill="#0ea5e9"/>
<circle cx="252" cy="212" r="8" fill="#075985"/>
<circle class="tur-shine" cx="246" cy="206" r="5.5" fill="#ffffff"/>
<ellipse cx="123" cy="238" rx="13" ry="8" fill="#38bdf8" opacity="0.35"/>
<ellipse cx="277" cy="238" rx="13" ry="8" fill="#38bdf8" opacity="0.35"/>
<path d="M186,253 Q200,264 214,253" fill="none" stroke="#075985" stroke-width="3.5" stroke-linecap="round"/>
<g class="tur-arm-l"><rect x="104" y="186" width="24" height="112" rx="12" fill="#38bdf8" stroke="#075985" stroke-width="3"/></g><g class="tur-arm-r"><rect x="272" y="186" width="24" height="112" rx="12" fill="#38bdf8" stroke="#075985" stroke-width="3"/></g>
<rect x="140" y="306" width="34" height="26" rx="9" fill="#38bdf8" stroke="#075985" stroke-width="3"/><g class="tur-flicker"><path d="M150,332 C145,342 147,350 154,356 C161,350 162,342 157,332 Z" fill="#38bdf8"/></g><rect x="230" y="306" width="34" height="26" rx="9" fill="#38bdf8" stroke="#075985" stroke-width="3"/><g class="tur-flicker"><path d="M240,332 C235,342 237,350 244,356 C251,350 252,342 247,332 Z" fill="#38bdf8"/></g>
</g>
<g transform="translate(48,292) scale(1.15)"><path class="twinkle" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ffffff"/></g>
<g transform="translate(88,204) scale(0.95)"><path class="twinkle d1" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ff9ff3"/></g>
<g transform="translate(110,118) scale(1.05)"><path class="twinkle d2" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#c8a2ff"/></g>
</svg>
