<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Turbo Sloth">
  <title>Bizarro Turbo Sloth</title>
  <desc>A bizarro cute turbo sloth floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .tur-shine { animation: turShine 3.0s ease-in-out infinite; }
    @keyframes turShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .tur-arm-l { animation: turArmL 3.7s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes turArmL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(5deg); }
}
    .tur-arm-r { animation: turArmR 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes turArmR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-5deg); }
}
    .tur-flicker { animation: turFlicker 0.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes turFlicker {
  0%, 100% { transform: scaleY(1); opacity: 0.9; }
  50% { transform: scaleY(1.2); opacity: 1; }
}
    .tur-float { animation: turFloat 4.3s ease-in-out infinite; }
    @keyframes turFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-7px) rotate(1.2deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: turTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes turTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  tur-arm-l, tur-arm-r, tur-flicker, tur-float, tur-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f2f9ff"/>
  <circle cx="200" cy="206" r="172" fill="#e0f2fe"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#aedffa" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="tur-float">
<circle cx="138" cy="150" r="24" fill="#7dd3fc" stroke="#075985" stroke-width="3"/><circle cx="138" cy="150" r="12" fill="#bae6fd"/><circle cx="262" cy="150" r="24" fill="#7dd3fc" stroke="#075985" stroke-width="3"/><circle cx="262" cy="150" r="12" fill="#bae6fd"/>
<ellipse cx="200" cy="238" rx="98" ry="82" fill="#7dd3fc" stroke="#075985" stroke-width="3"/>
