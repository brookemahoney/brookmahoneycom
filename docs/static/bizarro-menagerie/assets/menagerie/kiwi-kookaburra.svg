<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Kiwi Kookaburra">
  <title>Bizarro Kiwi Kookaburra</title>
  <desc>A bizarro cute kiwi kookaburra bobbing among sparkles, with giant eyes and twinkling sparkles.</desc>
  <style>
    .kiw-tail { animation: kiwTail 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes kiwTail {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(6deg); }
}
    .kiw-wing-l { animation: kiwWingL 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    @keyframes kiwWingL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-13deg); }
}
    .kiw-wing-r { animation: kiwWingR 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes kiwWingR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(13deg); }
}
    .kiw-shine { animation: kiwShine 3.0s ease-in-out infinite; }
    @keyframes kiwShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .kiw-float { animation: kiwFloat 4.6s ease-in-out infinite; }
    @keyframes kiwFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-13px) rotate(0.7deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: kiwTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes kiwTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  kiw-float, kiw-shine, kiw-tail, kiw-wing-l, kiw-wing-r, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f2fdf8"/>
