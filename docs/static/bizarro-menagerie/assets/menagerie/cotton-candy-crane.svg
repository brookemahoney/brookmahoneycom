<circle cx="184" cy="136" r="11.5" fill="#a855f7"/>
<circle cx="184" cy="136" r="6" fill="#5b21b6"/>
<circle class="cot-shine" cx="180" cy="131" r="4" fill="#ffffff"/>
<circle cx="216" cy="136" r="19" fill="#ffffff"/>
<circle cx="216" cy="136" r="11.5" fill="#a855f7"/>
<circle cx="216" cy="136" r="6" fill="#5b21b6"/>
