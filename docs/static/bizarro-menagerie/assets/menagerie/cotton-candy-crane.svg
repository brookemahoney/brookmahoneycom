<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Cotton Candy Crane">
  <title>Bizarro Cotton Candy Crane</title>
  <desc>A bizarro cute cotton candy crane bobbing among sparkles, with giant eyes and twinkling sparkles.</desc>
  <style>
    .cot-shine { animation: cotShine 3.0s ease-in-out infinite; }
    @keyframes cotShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .cot-float { animation: cotFloat 4.4s ease-in-out infinite; }
    @keyframes cotFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(1.3deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: cotTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes cotTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  cot-float, cot-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fdf2fb"/>
  <circle cx="200" cy="206" r="172" fill="#fbe0f3"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#f3c2e3" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="cot-float">
