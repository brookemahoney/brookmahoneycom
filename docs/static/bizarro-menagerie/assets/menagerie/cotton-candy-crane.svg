<line x1="302" y1="152" x2="302" y2="120" stroke="#5b21b6" stroke-width="4"/><circle cx="286" cy="108" r="17" fill="#f368e0"/><circle cx="318" cy="108" r="17" fill="#f368e0"/><circle cx="302" cy="94" r="21" fill="#f368e0"/><circle cx="302" cy="116" r="19" fill="#f368e0"/><circle cx="302" cy="106" r="24" fill="none" stroke="#ffc9ef" stroke-width="2" opacity="0.7"/>
</g>
<g transform="translate(150,64) scale(1.15)"><path class="twinkle" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ffffff"/></g>
<g transform="translate(356,150) scale(0.95)"><path class="twinkle d1" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ff9ff3"/></g>
