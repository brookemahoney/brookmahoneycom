<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Cosmic Crab">
  <title>Bizarro Cosmic Crab</title>
  <desc>A bizarro cute cosmic crab floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .cos-shine { animation: cosShine 3.0s ease-in-out infinite; }
    @keyframes cosShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .cos-float { animation: cosFloat 4.1s ease-in-out infinite; }
    @keyframes cosFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(1.3deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: cosTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes cosTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  cos-float, cos-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f3f2ff"/>
