<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Lemon Lemur">
  <title>Bizarro Lemon Lemur</title>
  <desc>A bizarro cute lemon lemur floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .lem-tail { animation: lemTail 2.9s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes lemTail {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-11deg); }
}
    .lem-shine { animation: lemShine 3.0s ease-in-out infinite; }
    @keyframes lemShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .lem-float { animation: lemFloat 4.5s ease-in-out infinite; }
    @keyframes lemFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(1.2deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: lemTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes lemTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  lem-float, lem-shine, lem-tail, twinkle { animation: none !important; }
}
  </style>
