<circle class="fiz-rise" style="animation-delay:-0.0s" cx="302" cy="130" r="11" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
<circle class="fiz-rise" style="animation-delay:-0.7s" cx="322" cy="100" r="8" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
