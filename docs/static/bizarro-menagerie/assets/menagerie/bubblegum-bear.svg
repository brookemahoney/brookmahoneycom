<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Bubblegum Bear">
  <title>Bizarro Bubblegum Bear</title>
  <desc>A bizarro cute bubblegum bear floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .bub-shine { animation: bubShine 3.0s ease-in-out infinite; }
    @keyframes bubShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .bub-rise { animation: bubRise 3.4s ease-in-out infinite; }
    @keyframes bubRise {
  0% { transform: translateY(0); opacity: 0; }
  25% { opacity: 0.85; }
  100% { transform: translateY(-34px); opacity: 0; }
}
    .bub-float { animation: bubFloat 4.7s ease-in-out infinite; }
    @keyframes bubFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(0.7deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: bubTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes bubTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  bub-float, bub-rise, bub-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fdf2fb"/>
  <circle cx="200" cy="206" r="172" fill="#fbe0f3"/>
