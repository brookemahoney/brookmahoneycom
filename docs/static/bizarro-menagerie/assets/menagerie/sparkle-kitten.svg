<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro cute sparkle kitten with twinkling sparkles">
  <title>Sparkle Kitten</title>
  <desc>A giant-eyed pink kitten with a tiny smile, floating among twinkling four-point star sparkles.</desc>
  <style>
    .kitten-bob { animation: kittenBob 3.4s ease-in-out infinite; }
    @keyframes kittenBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }
    .twinkle {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 2.6s ease-in-out infinite;
    }
    .twinkle.d1 { animation-delay: -0.5s; }
    .twinkle.d2 { animation-delay: -1.1s; }
    .twinkle.d3 { animation-delay: -1.7s; }
    .twinkle.d4 { animation-delay: -2.2s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    .twinkle.d6 { animation-delay: -1.4s; }
    @keyframes twinkle {
      0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
      50% { transform: scale(1.1) rotate(12deg); opacity: 1; }
    }
    .eye-shine { animation: eyeShine 3s ease-in-out infinite; }
    @keyframes eyeShine {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @media (prefers-reduced-motion: reduce) {
      .kitten-bob, .twinkle, .eye-shine { animation: none !important; }
    }
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
  <circle cx="200" cy="206" r="172" fill="#ffe3fa"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#ffd0f4" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
  <g class="kitten-bob">
    <path d="M118,148 C98,96 104,48 132,44 C162,41 178,82 174,122 Z" fill="#f368e0"/>
    <path d="M128,132 C116,100 120,66 136,64 C154,62 164,88 162,116 Z" fill="#c8a2ff"/>
    <path d="M282,148 C302,96 296,48 268,44 C238,41 222,82 226,122 Z" fill="#f368e0"/>
    <path d="M272,132 C284,100 280,66 264,64 C246,62 236,88 238,116 Z" fill="#c8a2ff"/>
    <ellipse cx="200" cy="228" rx="118" ry="102" fill="#ff9ff3"/>
    <ellipse cx="124" cy="256" rx="15" ry="9" fill="#f368e0" opacity="0.35"/>
    <ellipse cx="276" cy="256" rx="15" ry="9" fill="#f368e0" opacity="0.35"/>
    <circle cx="156" cy="216" r="34" fill="#ffffff"/>
    <circle cx="244" cy="216" r="34" fill="#ffffff"/>
    <circle cx="159" cy="220" r="19" fill="#8b5cf6"/>
    <circle cx="241" cy="220" r="19" fill="#8b5cf6"/>
    <circle cx="159" cy="220" r="9" fill="#5b21b6"/>
    <circle cx="241" cy="220" r="9" fill="#5b21b6"/>
    <circle class="eye-shine" cx="150" cy="209" r="7" fill="#ffffff"/>
    <circle class="eye-shine" cx="232" cy="209" r="7" fill="#ffffff"/>
    <path d="M192,250 Q200,245 208,250 Q205,259 200,260 Q195,259 192,250 Z" fill="#f368e0"/>
    <path d="M186,266 Q193,272 200,267 Q207,272 214,266" fill="none" stroke="#5b21b6" stroke-width="3.5" stroke-linecap="round"/>
    <g fill="none" stroke="#5b21b6" stroke-width="2.5" stroke-linecap="round" opacity="0.35">
      <path d="M96,238 L60,230"/>
      <path d="M98,252 L62,254"/>
      <path d="M96,266 L64,276"/>
      <path d="M304,238 L340,230"/>
      <path d="M302,252 L338,254"/>
      <path d="M304,266 L336,276"/>
    </g>
  </g>
  <g transform="translate(64,86) scale(1.25)"><path class="twinkle" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ffffff"/></g>
  <g transform="translate(336,80) scale(1.05)"><path class="twinkle d1" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#c8a2ff"/></g>
  <g transform="translate(348,216) scale(0.9)"><path class="twinkle d2" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ff9ff3"/></g>
  <g transform="translate(56,300) scale(0.85)"><path class="twinkle d3" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#c8a2ff"/></g>
  <g transform="translate(322,322) scale(1.1)"><path class="twinkle d4" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ffffff"/></g>
  <g transform="translate(180,58) scale(0.7)"><path class="twinkle d5" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ff9ff3"/></g>
</svg>
