<g class="giz-arm-l"><ellipse cx="116" cy="262" rx="32" ry="56" transform="rotate(12 116 262)" fill="#6ee7b7" stroke="#065f46" stroke-width="3"/></g><g class="giz-arm-r"><ellipse cx="284" cy="262" rx="32" ry="56" transform="rotate(-12 284 262)" fill="#6ee7b7" stroke="#065f46" stroke-width="3"/></g>
<ellipse cx="152" cy="318" rx="17" ry="9" fill="#34d399" stroke="#065f46" stroke-width="3"/><ellipse cx="248" cy="318" rx="17" ry="9" fill="#34d399" stroke="#065f46" stroke-width="3"/>
