<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Gizmo Gorilla">
  <title>Bizarro Gizmo Gorilla</title>
  <desc>A bizarro cute gizmo gorilla floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .giz-shine { animation: gizShine 3.0s ease-in-out infinite; }
    @keyframes gizShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .giz-arm-l { animation: gizArmL 3.0s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes gizArmL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(4deg); }
}
    .giz-arm-r { animation: gizArmR 3.3s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes gizArmR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-4deg); }
}
    .giz-spin { animation: gizSpin 7.5s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes gizSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
    .giz-float { animation: gizFloat 4.7s ease-in-out infinite; }
    @keyframes gizFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(1.0deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: gizTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes gizTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  giz-arm-l, giz-arm-r, giz-float, giz-shine, giz-spin, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f2fdf8"/>
  <circle cx="200" cy="206" r="172" fill="#dcf7ec"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#b3e9cf" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
