<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Pickle Phoenix">
  <title>Bizarro Pickle Phoenix</title>
  <desc>A bizarro cute pickle phoenix bobbing among sparkles, with giant eyes and twinkling sparkles.</desc>
  <style>
    .pic-flicker { animation: picFlicker 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes picFlicker {
  0%, 100% { transform: scaleY(1); opacity: 0.9; }
  50% { transform: scaleY(1.16); opacity: 1; }
}
    .pic-wing-l { animation: picWingL 2.1s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    @keyframes picWingL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-13deg); }
}
    .pic-wing-r { animation: picWingR 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes picWingR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(13deg); }
}
    .pic-flicker { animation: picFlicker 1.0s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes picFlicker {
  0%, 100% { transform: scaleY(1); opacity: 0.9; }
  50% { transform: scaleY(1.16); opacity: 1; }
}
    .pic-shine { animation: picShine 3.0s ease-in-out infinite; }
    @keyframes picShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .pic-float { animation: picFloat 4.7s ease-in-out infinite; }
    @keyframes picFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-12px) rotate(1.0deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: picTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes picTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  pic-flicker, pic-float, pic-shine, pic-wing-l, pic-wing-r, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f2fdf8"/>
