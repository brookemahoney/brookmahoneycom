<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Astronaut Axolotl">
  <title>Bizarro Astronaut Axolotl</title>
  <desc>A bizarro cute astronaut axolotl floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .ast-shine { animation: astShine 3.0s ease-in-out infinite; }
    @keyframes astShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .ast-gill-l { animation: astGillL 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    @keyframes astGillL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(10deg); }
}
    .ast-gill-r { animation: astGillR 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes astGillR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(10deg); }
}
    .ast-float { animation: astFloat 4.0s ease-in-out infinite; }
    @keyframes astFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(1.4deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: astTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes astTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  ast-float, ast-gill-l, ast-gill-r, ast-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
  <circle cx="200" cy="206" r="172" fill="#ffe3fa"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#ffd0f4" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="ast-float">

