<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Pixel Penguin">
  <title>Bizarro Pixel Penguin</title>
  <desc>A bizarro cute pixel penguin bobbing among sparkles, with giant eyes and twinkling sparkles.</desc>
  <style>
    .pix-tail { animation: pixTail 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes pixTail {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(6deg); }
}
    .pix-wing-l { animation: pixWingL 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    @keyframes pixWingL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-13deg); }
}
    .pix-wing-r { animation: pixWingR 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes pixWingR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(13deg); }
}
    .pix-shine { animation: pixShine 3.0s ease-in-out infinite; }
    @keyframes pixShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .pix-float { animation: pixFloat 4.1s ease-in-out infinite; }
    @keyframes pixFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-7px) rotate(1.4deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: pixTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes pixTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  pix-float, pix-shine, pix-tail, pix-wing-l, pix-wing-r, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f3f2ff"/>
  <circle cx="200" cy="206" r="172" fill="#e7e5ff"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#c9c5ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
