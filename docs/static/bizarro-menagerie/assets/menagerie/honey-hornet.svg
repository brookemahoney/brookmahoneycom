<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Honey Hornet">
  <title>Bizarro Honey Hornet</title>
  <desc>A bizarro cute honey hornet hovering on fluttering wings, with giant eyes and twinkling sparkles.</desc>
  <style>
    .hon-flutter { animation: honFlutter 2.1s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    @keyframes honFlutter {
  0%, 100% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(-8deg) scale(1.05); }
}
    .hon-flutter-r { animation: honFlutterR 1.7s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    @keyframes honFlutterR {
  0%, 100% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(8deg) scale(1.05); }
}
    .hon-shine { animation: honShine 3.0s ease-in-out infinite; }
    @keyframes honShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .hon-float { animation: honFloat 4.3s ease-in-out infinite; }
    @keyframes honFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-12px) rotate(0.8deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: honTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes honTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  hon-float, hon-flutter, hon-flutter-r, hon-shine, twinkle { animation: none !important; }
}
  </style>
