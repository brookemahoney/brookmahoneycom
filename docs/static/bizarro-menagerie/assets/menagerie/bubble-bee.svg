<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Bubble Bee">
  <title>Bizarro Bubble Bee</title>
  <desc>A bizarro cute bubble bee hovering on fluttering wings, with giant eyes and twinkling sparkles.</desc>
  <style>
    .bub-flutter { animation: bubFlutter 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    @keyframes bubFlutter {
  0%, 100% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(-8deg) scale(1.05); }
}
    .bub-flutter-r { animation: bubFlutterR 2.3s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    @keyframes bubFlutterR {
  0%, 100% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(8deg) scale(1.05); }
}
    .bub-shine { animation: bubShine 3.0s ease-in-out infinite; }
    @keyframes bubShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .bub-rise { animation: bubRise 3.2s ease-in-out infinite; }
    @keyframes bubRise {
  0% { transform: translateY(0); opacity: 0; }
  25% { opacity: 0.85; }
  100% { transform: translateY(-34px); opacity: 0; }
}
    .bub-float { animation: bubFloat 4.6s ease-in-out infinite; }
    @keyframes bubFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-9px) rotate(0.7deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: bubTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes bubTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  bub-float, bub-flutter, bub-flutter-r, bub-rise, bub-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fffdf4"/>
  <circle cx="200" cy="206" r="172" fill="#fef6d8"/>
