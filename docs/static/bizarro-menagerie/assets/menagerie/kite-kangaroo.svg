<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Kite Kangaroo">
  <title>Bizarro Kite Kangaroo</title>
  <desc>A bizarro cute kite kangaroo floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .kit-tail { animation: kitTail 2.9s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes kitTail {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-11deg); }
}
    .kit-shine { animation: kitShine 3.0s ease-in-out infinite; }
    @keyframes kitShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .kit-kitesway { animation: kitKite 3.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes kitKite {
  0%, 100% { transform: rotate(-3deg); }
  50% { transform: rotate(4deg); }
}
    .kit-float { animation: kitFloat 3.7s ease-in-out infinite; }
    @keyframes kitFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-11px) rotate(1.2deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: kitTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes kitTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  kit-float, kit-kitesway, kit-shine, kit-tail, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
  <circle cx="200" cy="206" r="172" fill="#ffe3fa"/>
