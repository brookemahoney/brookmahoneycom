<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Papaya Pelican">
  <title>Bizarro Papaya Pelican</title>
  <desc>A bizarro cute papaya pelican bobbing among sparkles, with giant eyes and twinkling sparkles.</desc>
  <style>
    .pap-tail { animation: papTail 3.0s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes papTail {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(6deg); }
}
    .pap-wing-l { animation: papWingL 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    @keyframes papWingL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-13deg); }
}
    .pap-wing-r { animation: papWingR 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes papWingR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(13deg); }
}
    .pap-shine { animation: papShine 3.0s ease-in-out infinite; }
    @keyframes papShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .pap-float { animation: papFloat 3.9s ease-in-out infinite; }
    @keyframes papFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(0.6deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: papTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes papTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  pap-float, pap-shine, pap-tail, pap-wing-l, pap-wing-r, twinkle { animation: none !important; }
}
  </style>
