<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Quasar Quokka">
  <title>Bizarro Quasar Quokka</title>
  <desc>A bizarro cute quasar quokka floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .qua-shine { animation: quaShine 3.0s ease-in-out infinite; }
    @keyframes quaShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .qua-float { animation: quaFloat 4.1s ease-in-out infinite; }
    @keyframes quaFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(1.2deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: quaTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes quaTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  qua-float, qua-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fffdf4"/>
