<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Watermelon Whale">
  <title>Bizarro Watermelon Whale</title>
  <desc>A bizarro cute watermelon whale drifting in a sea of sparkle, with giant eyes and twinkling sparkles.</desc>
  <style>
    .wat-shine { animation: watShine 3.0s ease-in-out infinite; }
    @keyframes watShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .wat-spout { animation: watSpout 2.2s ease-in-out infinite; }
    @keyframes watSpout {
  0% { transform: translateY(0); opacity: 0; }
  30% { opacity: 0.9; }
  100% { transform: translateY(-30px); opacity: 0; }
}
    .wat-float { animation: watFloat 3.6s ease-in-out infinite; }
    @keyframes watFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(1.3deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: watTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes watTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  twinkle, wat-float, wat-shine, wat-spout { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
  <circle cx="200" cy="206" r="172" fill="#ffe3fa"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#ffd0f4" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="wat-float">
<path d="M96,250 C64,228 46,250 58,274 C70,296 94,286 100,264 Z" fill="#f368e0" stroke="#5b21b6" stroke-width="3" stroke-linejoin="round"/><ellipse cx="206" cy="264" rx="112" ry="72" fill="#ff9ff3" stroke="#5b21b6" stroke-width="3"/><path d="M212,196 C218,168 238,166 244,194 Z" fill="#f368e0" stroke="#5b21b6" stroke-width="3" stroke-linejoin="round"/><ellipse cx="256" cy="306" rx="15" ry="30" transform="rotate(-28 256 306)" fill="#f368e0" stroke="#5b21b6" stroke-width="3"/><circle cx="252" cy="240" r="21" fill="#ffffff"/><circle cx="252" cy="241" r="12.5" fill="#8b5cf6"/><circle cx="252" cy="241" r="6.5" fill="#5b21b6"/><circle class="wat-shine" cx="248" cy="236" r="4.5" fill="#ffffff"/><ellipse cx="206" cy="262" rx="18" ry="10" fill="#ffd6f7" opacity="0.6"/><path d="M222,278 Q240,288 258,278" fill="none" stroke="#5b21b6" stroke-width="4" stroke-linecap="round"/><ellipse cx="296" cy="288" rx="20" ry="10" fill="#ffd6f7" opacity="0.5"/><circle class="wat-spout" style="animation-delay:-0.00s" cx="172" cy="158" r="8" fill="#ffffff" opacity="0.85"/>
