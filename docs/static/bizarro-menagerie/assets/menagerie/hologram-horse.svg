<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Hologram Horse">
  <title>Bizarro Hologram Horse</title>
  <desc>A bizarro cute hologram horse floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .hol-holo { animation: holHolo 3.0s ease-in-out infinite; }
    @keyframes holHolo {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 0.75; }
}
    .hol-shine { animation: holShine 3.0s ease-in-out infinite; }
    @keyframes holShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .hol-float { animation: holFloat 4.6s ease-in-out infinite; }
    @keyframes holFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-13px) rotate(1.2deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: holTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes holTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  hol-float, hol-holo, hol-shine, twinkle { animation: none !important; }
}
  </style>
