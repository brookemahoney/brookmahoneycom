<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Macaron Macaw">
  <title>Bizarro Macaron Macaw</title>
  <desc>A bizarro cute macaron macaw bobbing among sparkles, with giant eyes and twinkling sparkles.</desc>
  <style>
    .mac-tail { animation: macTail 3.0s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes macTail {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(5deg); }
}
    .mac-wing-l { animation: macWingL 2.1s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    @keyframes macWingL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-13deg); }
}
    .mac-wing-r { animation: macWingR 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes macWingR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(13deg); }
}
    .mac-shine { animation: macShine 3.0s ease-in-out infinite; }
    @keyframes macShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .mac-float { animation: macFloat 3.7s ease-in-out infinite; }
    @keyframes macFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-11px) rotate(1.0deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: macTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes macTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  mac-float, mac-shine, mac-tail, mac-wing-l, mac-wing-r, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
