<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Jet Jellyfish">
  <title>Bizarro Jet Jellyfish</title>
  <desc>A bizarro cute jet jellyfish drifting in a sea of sparkle, with giant eyes and twinkling sparkles.</desc>
  <style>
    .jet-tent { animation: jetTent 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes jetTent {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(6deg); }
}
    .jet-shine { animation: jetShine 3.0s ease-in-out infinite; }
    @keyframes jetShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .jet-flicker { animation: jetFlicker 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes jetFlicker {
  0%, 100% { transform: scaleY(1); opacity: 0.9; }
  50% { transform: scaleY(1.18); opacity: 1; }
}
    .jet-float { animation: jetFloat 3.8s ease-in-out infinite; }
    @keyframes jetFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-13px) rotate(0.9deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: jetTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes jetTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  jet-flicker, jet-float, jet-shine, jet-tent, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f2f9ff"/>
  <circle cx="200" cy="206" r="172" fill="#e0f2fe"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#aedffa" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="jet-float">
