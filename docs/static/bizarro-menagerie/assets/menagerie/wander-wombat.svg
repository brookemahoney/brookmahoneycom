<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Wander Wombat">
  <title>Bizarro Wander Wombat</title>
  <desc>A bizarro cute wander wombat floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .wan-shine { animation: wanShine 3.0s ease-in-out infinite; }
    @keyframes wanShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .wan-float { animation: wanFloat 4.7s ease-in-out infinite; }
    @keyframes wanFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-7px) rotate(1.1deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: wanTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes wanTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  twinkle, wan-float, wan-shine { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f2f9ff"/>
