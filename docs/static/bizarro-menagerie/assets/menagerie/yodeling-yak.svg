<path d="M180,162 L186,116 L200,160 Z" fill="#ffffff" stroke="#713f12" stroke-width="3" stroke-linejoin="round"/><path d="M220,160 L214,116 L200,162 Z" fill="#ffffff" stroke="#713f12" stroke-width="3" stroke-linejoin="round"/>
<ellipse cx="200" cy="238" rx="98" ry="82" fill="#fde047" stroke="#713f12" stroke-width="3"/>
<ellipse cx="200" cy="252" rx="62" ry="46" fill="#fef08a" opacity="0.85"/>
