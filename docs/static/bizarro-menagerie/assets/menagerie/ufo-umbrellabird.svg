<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Ufo Umbrellabird">
  <title>Bizarro Ufo Umbrellabird</title>
  <desc>A bizarro cute ufo umbrellabird bobbing among sparkles, with giant eyes and twinkling sparkles.</desc>
  <style>
    .ufo-tail { animation: ufoTail 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes ufoTail {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(6deg); }
}
    .ufo-wing-l { animation: ufoWingL 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    @keyframes ufoWingL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-13deg); }
}
    .ufo-wing-r { animation: ufoWingR 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes ufoWingR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(13deg); }
}
    .ufo-shine { animation: ufoShine 3.0s ease-in-out infinite; }
    @keyframes ufoShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .ufo-hover { animation: ufoHover 2.3s ease-in-out infinite; }
    @keyframes ufoHover {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}
    .ufo-float { animation: ufoFloat 4.6s ease-in-out infinite; }
    @keyframes ufoFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-11px) rotate(1.3deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: ufoTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes ufoTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  twinkle, ufo-float, ufo-hover, ufo-shine, ufo-tail, ufo-wing-l, ufo-wing-r { animation: none !important; }
}
  </style>
