<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Strawberry Swan">
  <title>Bizarro Strawberry Swan</title>
  <desc>A bizarro cute strawberry swan bobbing among sparkles, with giant eyes and twinkling sparkles.</desc>
  <style>
    .str-shine { animation: strShine 3.0s ease-in-out infinite; }
    @keyframes strShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .str-float { animation: strFloat 4.7s ease-in-out infinite; }
    @keyframes strFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-12px) rotate(0.7deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: strTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes strTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  str-float, str-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
  <circle cx="200" cy="206" r="172" fill="#ffe3fa"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#ffd0f4" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="str-float">
