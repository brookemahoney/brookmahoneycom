<path d="M268,144 A34,34 0 0 1 336,144 Z" fill="#ff9ff3" stroke="#5b21b6" stroke-width="3"/><path d="M268,144 A34,34 0 0 1 336,144 Z" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.35"/><path d="M274,144 A28,28 0 0 1 330,144 Z" fill="#ff9ff3"/><path d="M302,144 L323,132" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/><path d="M302,144 L314,123" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/><path d="M302,144 L302,120" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/><path d="M302,144 L290,123" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/><path d="M302,144 L281,132" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
</g>
<g transform="translate(352,222) scale(1.15)"><path class="twinkle" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ffffff"/></g>
<g transform="translate(48,292) scale(0.95)"><path class="twinkle d1" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ff9ff3"/></g>
<g transform="translate(296,58) scale(1.05)"><path class="twinkle d2" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#c8a2ff"/></g>
