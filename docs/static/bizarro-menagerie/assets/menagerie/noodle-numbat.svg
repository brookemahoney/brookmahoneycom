<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Noodle Numbat">
  <title>Bizarro Noodle Numbat</title>
  <desc>A bizarro cute noodle numbat floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .noo-tail { animation: nooTail 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes nooTail {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-11deg); }
}
    .noo-shine { animation: nooShine 3.0s ease-in-out infinite; }
    @keyframes nooShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .noo-float { animation: nooFloat 3.7s ease-in-out infinite; }
    @keyframes nooFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-9px) rotate(1.2deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: nooTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes nooTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  noo-float, noo-shine, noo-tail, twinkle { animation: none !important; }
}
  </style>
