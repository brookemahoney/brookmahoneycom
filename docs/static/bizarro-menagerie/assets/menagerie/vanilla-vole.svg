<circle cx="138" cy="150" r="24" fill="#fde047" stroke="#713f12" stroke-width="3"/><circle cx="138" cy="150" r="12" fill="#fef08a"/><circle cx="262" cy="150" r="24" fill="#fde047" stroke="#713f12" stroke-width="3"/><circle cx="262" cy="150" r="12" fill="#fef08a"/>
