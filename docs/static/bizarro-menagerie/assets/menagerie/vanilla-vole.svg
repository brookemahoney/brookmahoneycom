<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Vanilla Vole">
  <title>Bizarro Vanilla Vole</title>
  <desc>A bizarro cute vanilla vole floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .van-tail { animation: vanTail 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes vanTail {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}
    .van-shine { animation: vanShine 3.0s ease-in-out infinite; }
    @keyframes vanShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .van-float { animation: vanFloat 4.3s ease-in-out infinite; }
    @keyframes vanFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(1.1deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: vanTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes vanTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  twinkle, van-float, van-shine, van-tail { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fffdf4"/>
  <circle cx="200" cy="206" r="172" fill="#fef6d8"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#f5e3a8" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="van-float">
