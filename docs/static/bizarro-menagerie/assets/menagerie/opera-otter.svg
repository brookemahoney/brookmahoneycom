<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Opera Otter">
  <title>Bizarro Opera Otter</title>
  <desc>A bizarro cute opera otter floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .ope-tail { animation: opeTail 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes opeTail {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-7deg); }
}
    .ope-shine { animation: opeShine 3.0s ease-in-out infinite; }
    @keyframes opeShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .ope-float { animation: opeFloat 4.7s ease-in-out infinite; }
    @keyframes opeFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-9px) rotate(0.6deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: opeTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes opeTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  ope-float, ope-shine, ope-tail, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
  <circle cx="200" cy="206" r="172" fill="#ffe3fa"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#ffd0f4" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="ope-float">
<g class="ope-tail"><ellipse cx="306" cy="262" rx="34" ry="20" transform="rotate(-28 306 262)" fill="#ff9ff3" stroke="#5b21b6" stroke-width="3"/></g>
<circle cx="146" cy="154" r="16" fill="#ff9ff3" stroke="#5b21b6" stroke-width="3"/><circle cx="146" cy="154" r="8" fill="#ffd6f7"/><circle cx="254" cy="154" r="16" fill="#ff9ff3" stroke="#5b21b6" stroke-width="3"/><circle cx="254" cy="154" r="8" fill="#ffd6f7"/>
<ellipse cx="200" cy="238" rx="98" ry="82" fill="#ff9ff3" stroke="#5b21b6" stroke-width="3"/>
<ellipse cx="200" cy="252" rx="62" ry="46" fill="#ffd6f7" opacity="0.85"/>
