<circle cx="252" cy="212" r="27" fill="#ffffff"/>
<circle cx="252" cy="212" r="16" fill="#8b5cf6"/>
<circle cx="252" cy="212" r="8" fill="#5b21b6"/>
<circle class="ope-shine" cx="246" cy="206" r="5.5" fill="#ffffff"/>
<ellipse cx="123" cy="238" rx="13" ry="8" fill="#f368e0" opacity="0.35"/>
<ellipse cx="277" cy="238" rx="13" ry="8" fill="#f368e0" opacity="0.35"/>
<path d="M186,253 Q200,264 214,253" fill="none" stroke="#5b21b6" stroke-width="3.5" stroke-linecap="round"/>
<ellipse cx="152" cy="318" rx="17" ry="9" fill="#f368e0" stroke="#5b21b6" stroke-width="3"/><ellipse cx="248" cy="318" rx="17" ry="9" fill="#f368e0" stroke="#5b21b6" stroke-width="3"/>
<circle cx="148" cy="212" r="18" fill="#ffd6f7" fill-opacity="0.4" stroke="#5b21b6" stroke-width="4"/><circle cx="252" cy="212" r="18" fill="#ffd6f7" fill-opacity="0.4" stroke="#5b21b6" stroke-width="4"/><path d="M166,212 L234,212" stroke="#5b21b6" stroke-width="4"/><path d="M270,210 L284,222" stroke="#5b21b6" stroke-width="4" stroke-linecap="round"/>
</g>
<g transform="translate(342,82) scale(1.15)"><path class="twinkle" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ffffff"/></g>
<g transform="translate(110,118) scale(0.95)"><path class="twinkle d1" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ff9ff3"/></g>
