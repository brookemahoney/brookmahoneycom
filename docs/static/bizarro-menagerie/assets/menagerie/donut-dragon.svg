<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Donut Dragon">
  <title>Bizarro Donut Dragon</title>
  <desc>A bizarro cute donut dragon floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .don-wing-l { animation: donWingL 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    @keyframes donWingL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-16deg); }
}
    .don-wing-r { animation: donWingR 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes donWingR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(16deg); }
}
    .don-shine { animation: donShine 3.0s ease-in-out infinite; }
    @keyframes donShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .don-float { animation: donFloat 4.3s ease-in-out infinite; }
    @keyframes donFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(1.3deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: donTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes donTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  don-float, don-shine, don-wing-l, don-wing-r, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
