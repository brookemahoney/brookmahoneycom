<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Diamond Deer">
  <title>Bizarro Diamond Deer</title>
  <desc>A bizarro cute diamond deer floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .dia-shine { animation: diaShine 3.0s ease-in-out infinite; }
    @keyframes diaShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .dia-float { animation: diaFloat 4.3s ease-in-out infinite; }
    @keyframes diaFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(0.9deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: diaTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes diaTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  dia-float, dia-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f3f2ff"/>
