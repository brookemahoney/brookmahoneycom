<circle cx="252" cy="212" r="27" fill="#ffffff"/>
<circle cx="252" cy="212" r="16" fill="#eab308"/>
<circle cx="252" cy="212" r="8" fill="#713f12"/>
<circle class="ban-shine" cx="246" cy="206" r="5.5" fill="#ffffff"/>
<ellipse cx="123" cy="238" rx="13" ry="8" fill="#facc15" opacity="0.35"/>
<ellipse cx="277" cy="238" rx="13" ry="8" fill="#facc15" opacity="0.35"/>
<path d="M186,253 Q200,264 214,253" fill="none" stroke="#713f12" stroke-width="3.5" stroke-linecap="round"/>
