<circle cx="158" cy="212" r="23" fill="#ffffff"/>
<circle cx="158" cy="212" r="14" fill="#0ea5e9"/>
<circle cx="158" cy="212" r="7" fill="#075985"/>
<circle class="tac-shine" cx="153" cy="206" r="5" fill="#ffffff"/>
<circle cx="242" cy="212" r="23" fill="#ffffff"/>
<circle cx="242" cy="212" r="14" fill="#0ea5e9"/>
<circle cx="242" cy="212" r="7" fill="#075985"/>
<circle class="tac-shine" cx="237" cy="206" r="5" fill="#ffffff"/>
<ellipse cx="137" cy="238" rx="13" ry="8" fill="#38bdf8" opacity="0.35"/>
<ellipse cx="263" cy="238" rx="13" ry="8" fill="#38bdf8" opacity="0.35"/>
