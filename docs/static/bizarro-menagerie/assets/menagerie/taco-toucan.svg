<ellipse cx="200" cy="246" rx="88" ry="70" fill="#7dd3fc" stroke="#075985" stroke-width="3"/>
<ellipse cx="200" cy="252" rx="62" ry="46" fill="#bae6fd" opacity="0.85"/>
