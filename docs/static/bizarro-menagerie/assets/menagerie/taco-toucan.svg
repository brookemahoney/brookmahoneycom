<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Taco Toucan">
  <title>Bizarro Taco Toucan</title>
  <desc>A bizarro cute taco toucan bobbing among sparkles, with giant eyes and twinkling sparkles.</desc>
  <style>
    .tac-tail { animation: tacTail 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes tacTail {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(6deg); }
}
    .tac-wing-l { animation: tacWingL 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    @keyframes tacWingL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-13deg); }
}
    .tac-wing-r { animation: tacWingR 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes tacWingR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(13deg); }
}
    .tac-shine { animation: tacShine 3.0s ease-in-out infinite; }
    @keyframes tacShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .tac-float { animation: tacFloat 4.8s ease-in-out infinite; }
    @keyframes tacFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(1.2deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: tacTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes tacTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  tac-float, tac-shine, tac-tail, tac-wing-l, tac-wing-r, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f2f9ff"/>
  <circle cx="200" cy="206" r="172" fill="#e0f2fe"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#aedffa" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="tac-float">
<g class="tac-tail"><ellipse cx="176" cy="318" rx="10" ry="26" transform="rotate(-24 176 318)" fill="#38bdf8" stroke="#075985" stroke-width="2.5"/><ellipse cx="200" cy="326" rx="10" ry="28" fill="#38bdf8" stroke="#075985" stroke-width="2.5"/><ellipse cx="224" cy="318" rx="10" ry="26" transform="rotate(24 224 318)" fill="#38bdf8" stroke="#075985" stroke-width="2.5"/></g>
