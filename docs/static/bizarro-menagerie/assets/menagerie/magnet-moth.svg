<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Magnet Moth">
  <title>Bizarro Magnet Moth</title>
  <desc>A bizarro cute magnet moth hovering on fluttering wings, with giant eyes and twinkling sparkles.</desc>
  <style>
    .mag-flutter { animation: magFlutter 1.9s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    @keyframes magFlutter {
  0%, 100% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(-8deg) scale(1.05); }
}
    .mag-flutter-r { animation: magFlutterR 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    @keyframes magFlutterR {
  0%, 100% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(8deg) scale(1.05); }
}
    .mag-shine { animation: magShine 3.0s ease-in-out infinite; }
    @keyframes magShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .mag-float { animation: magFloat 4.3s ease-in-out infinite; }
    @keyframes magFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-9px) rotate(1.2deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: magTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes magTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  mag-float, mag-flutter, mag-flutter-r, mag-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
