<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Mochi Mouse">
  <title>Bizarro Mochi Mouse</title>
  <desc>A bizarro cute mochi mouse floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .moc-shine { animation: mocShine 3.0s ease-in-out infinite; }
    @keyframes mocShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .moc-float { animation: mocFloat 3.8s ease-in-out infinite; }
    @keyframes mocFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-9px) rotate(0.8deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: mocTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes mocTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  moc-float, moc-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fffdf4"/>
  <circle cx="200" cy="206" r="172" fill="#fef6d8"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#f5e3a8" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="moc-float">
<circle cx="138" cy="150" r="24" fill="#fde047" stroke="#713f12" stroke-width="3"/><circle cx="138" cy="150" r="12" fill="#fef08a"/><circle cx="262" cy="150" r="24" fill="#fde047" stroke="#713f12" stroke-width="3"/><circle cx="262" cy="150" r="12" fill="#fef08a"/>
<ellipse cx="200" cy="238" rx="98" ry="82" fill="#fde047" stroke="#713f12" stroke-width="3"/>
<ellipse cx="200" cy="252" rx="62" ry="46" fill="#fef08a" opacity="0.85"/>
<circle cx="148" cy="212" r="27" fill="#ffffff"/>
<circle cx="148" cy="212" r="16" fill="#eab308"/>
<circle cx="148" cy="212" r="8" fill="#713f12"/>
<circle class="moc-shine" cx="142" cy="206" r="5.5" fill="#ffffff"/>
<circle cx="252" cy="212" r="27" fill="#ffffff"/>
<circle cx="252" cy="212" r="16" fill="#eab308"/>
<circle cx="252" cy="212" r="8" fill="#713f12"/>
<circle class="moc-shine" cx="246" cy="206" r="5.5" fill="#ffffff"/>
<ellipse cx="123" cy="238" rx="13" ry="8" fill="#facc15" opacity="0.35"/>
<ellipse cx="277" cy="238" rx="13" ry="8" fill="#facc15" opacity="0.35"/>
<path d="M186,253 Q200,264 214,253" fill="none" stroke="#713f12" stroke-width="3.5" stroke-linecap="round"/>
