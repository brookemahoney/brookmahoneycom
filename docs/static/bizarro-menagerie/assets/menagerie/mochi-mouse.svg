<ellipse cx="300" cy="284" rx="27" ry="20" fill="#ffffff" stroke="#fef08a" stroke-width="3"/><path d="M294,268 C289,257 298,249 308,253 C307,262 301,267 294,268 Z" fill="#facc15"/><ellipse cx="292" cy="280" rx="8" ry="5" fill="#fef6d8" opacity="0.9"/>
</g>
<g transform="translate(296,58) scale(1.15)"><path class="twinkle" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ffffff"/></g>
<g transform="translate(252,342) scale(0.95)"><path class="twinkle d1" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ff9ff3"/></g>
<g transform="translate(352,222) scale(1.05)"><path class="twinkle d2" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#c8a2ff"/></g>
