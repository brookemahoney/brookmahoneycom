<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Yo Yo Yeti">
  <title>Bizarro Yo Yo Yeti</title>
  <desc>A bizarro cute yo yo yeti floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .yoy-shine { animation: yoyShine 3.0s ease-in-out infinite; }
    @keyframes yoyShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .yoy-bob { animation: yoyBob 2.3s ease-in-out infinite; }
    @keyframes yoyBob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(9px); }
}
    .yoy-float { animation: yoyFloat 4.6s ease-in-out infinite; }
    @keyframes yoyFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(1.2deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: yoyTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes yoyTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  twinkle, yoy-bob, yoy-float, yoy-shine { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f5f3ff"/>
  <circle cx="200" cy="206" r="172" fill="#ece9ff"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#cfcaff" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="yoy-float">
<circle cx="138" cy="150" r="24" fill="#ffffff" stroke="#5b21b6" stroke-width="3"/><circle cx="138" cy="150" r="12" fill="#f3efff"/><circle cx="262" cy="150" r="24" fill="#ffffff" stroke="#5b21b6" stroke-width="3"/><circle cx="262" cy="150" r="12" fill="#f3efff"/>
<ellipse cx="200" cy="238" rx="98" ry="82" fill="#ffffff" stroke="#5b21b6" stroke-width="3"/>
<ellipse cx="200" cy="252" rx="62" ry="46" fill="#f3efff" opacity="0.85"/>
<circle cx="148" cy="212" r="27" fill="#ffffff"/>
<circle cx="148" cy="212" r="16" fill="#8b5cf6"/>
<circle cx="148" cy="212" r="8" fill="#5b21b6"/>
<circle class="yoy-shine" cx="142" cy="206" r="5.5" fill="#ffffff"/>
<circle cx="252" cy="212" r="27" fill="#ffffff"/>
<circle cx="252" cy="212" r="16" fill="#8b5cf6"/>
<circle cx="252" cy="212" r="8" fill="#5b21b6"/>
<circle class="yoy-shine" cx="246" cy="206" r="5.5" fill="#ffffff"/>
<ellipse cx="123" cy="238" rx="13" ry="8" fill="#e9d5ff" opacity="0.35"/>
<ellipse cx="277" cy="238" rx="13" ry="8" fill="#e9d5ff" opacity="0.35"/>
<path d="M186,253 Q200,264 214,253" fill="none" stroke="#5b21b6" stroke-width="3.5" stroke-linecap="round"/>
<ellipse cx="152" cy="318" rx="17" ry="9" fill="#e9d5ff" stroke="#5b21b6" stroke-width="3"/><ellipse cx="248" cy="318" rx="17" ry="9" fill="#e9d5ff" stroke="#5b21b6" stroke-width="3"/>
<path d="M284,278 C268,256 246,258 242,238" fill="none" stroke="#5b21b6" stroke-width="2.5"/><g class="yoy-bob"><circle cx="285" cy="300" r="19" fill="#ffffff" stroke="#5b21b6" stroke-width="3"/><circle cx="285" cy="300" r="7" fill="#f3efff"/></g>
</g>
<g transform="translate(150,64) scale(1.15)"><path class="twinkle" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ffffff"/></g>
<g transform="translate(48,292) scale(0.95)"><path class="twinkle d1" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ff9ff3"/></g>
<g transform="translate(252,342) scale(1.05)"><path class="twinkle d2" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#c8a2ff"/></g>
</svg>
