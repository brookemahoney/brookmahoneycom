<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Lava Lamp">
  <title>Bizarro Lava Lamp</title>
  <desc>A bizarro cute lava lamp glowing softly, with giant eyes and twinkling sparkles.</desc>
  <style>
    .lav-rise { animation: lavRise 3.1s ease-in-out infinite; }
    @keyframes lavRise {
  0% { transform: translateY(0); opacity: 0; }
  25% { opacity: 0.9; }
  100% { transform: translateY(-52px); opacity: 0; }
}
    .lav-shine { animation: lavShine 3.0s ease-in-out infinite; }
    @keyframes lavShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .lav-float { animation: lavFloat 4.5s ease-in-out infinite; }
    @keyframes lavFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-7px) rotate(0.8deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: lavTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes lavTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  lav-float, lav-rise, lav-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f2f9ff"/>
  <circle cx="200" cy="206" r="172" fill="#e0f2fe"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#aedffa" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="lav-float">
<rect x="162" y="312" width="76" height="26" rx="11" fill="#075985"/><rect x="172" y="300" width="56" height="10" rx="5" fill="#38bdf8"/><path d="M174,170 L226,170 L216,312 L184,312 Z" fill="#ffffff" opacity="0.5" stroke="#075985" stroke-width="3" stroke-linejoin="round"/><ellipse cx="200" cy="268" rx="22" ry="30" fill="#38bdf8" opacity="0.45"/><circle class="lav-rise" style="animation-delay:-0.0s" cx="192" cy="288" r="9" fill="#38bdf8" opacity="0.75"/>
<circle class="lav-rise" style="animation-delay:-0.9s" cx="208" cy="262" r="7" fill="#38bdf8" opacity="0.75"/>
<circle class="lav-rise" style="animation-delay:-1.8s" cx="198" cy="232" r="10" fill="#38bdf8" opacity="0.75"/>
<circle class="lav-rise" style="animation-delay:-2.7s" cx="206" cy="200" r="6" fill="#38bdf8" opacity="0.75"/><rect x="184" y="150" width="32" height="20" rx="9" fill="#38bdf8" stroke="#075985" stroke-width="3"/><circle cx="185" cy="222" r="13" fill="#ffffff"/>
<circle cx="185" cy="222" r="8" fill="#0ea5e9"/>
<circle cx="185" cy="222" r="4.5" fill="#075985"/>
<circle class="lav-shine" cx="182" cy="219" r="3.5" fill="#ffffff"/>
<circle cx="215" cy="222" r="13" fill="#ffffff"/>
<circle cx="215" cy="222" r="8" fill="#0ea5e9"/>
<circle cx="215" cy="222" r="4.5" fill="#075985"/>
<circle class="lav-shine" cx="212" cy="219" r="3.5" fill="#ffffff"/>
<ellipse cx="188" cy="248" rx="13" ry="8" fill="#38bdf8" opacity="0.35"/>
<ellipse cx="212" cy="248" rx="13" ry="8" fill="#38bdf8" opacity="0.35"/>
