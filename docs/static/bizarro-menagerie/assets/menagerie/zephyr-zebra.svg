<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Zephyr Zebra">
  <title>Bizarro Zephyr Zebra</title>
  <desc>A bizarro cute zephyr zebra floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .zep-shine { animation: zepShine 3.0s ease-in-out infinite; }
    @keyframes zepShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .zep-drift { animation: zepDrift 3.1s ease-in-out infinite; }
    @keyframes zepDrift {
  0%, 100% { transform: translateX(0); opacity: 0.5; }
  50% { transform: translateX(10px); opacity: 0.9; }
}
    .zep-float { animation: zepFloat 4.3s ease-in-out infinite; }
    @keyframes zepFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(1.2deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: zepTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes zepTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  twinkle, zep-drift, zep-float, zep-shine { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f3f2ff"/>
