<g class="emb-flicker" transform="translate(308,128)"><path d="M0,24 C-13,12 -13,-2 0,-18 C13,-2 13,12 0,24 Z" fill="#38bdf8"/><path d="M0,17 C-6,9 -5,1 0,-7 C5,1 6,9 0,17 Z" fill="#fde047"/></g>
</g>
