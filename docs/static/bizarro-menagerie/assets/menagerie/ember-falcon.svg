<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Ember Falcon">
  <title>Bizarro Ember Falcon</title>
  <desc>A bizarro cute ember falcon bobbing among sparkles, with giant eyes and twinkling sparkles.</desc>
  <style>
    .emb-tail { animation: embTail 3.3s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes embTail {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(5deg); }
}
    .emb-wing-l { animation: embWingL 2.3s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    @keyframes embWingL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-13deg); }
}
    .emb-wing-r { animation: embWingR 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes embWingR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(13deg); }
}
    .emb-shine { animation: embShine 3.0s ease-in-out infinite; }
    @keyframes embShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .emb-flicker { animation: embFlicker 1.0s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes embFlicker {
  0%, 100% { transform: scaleY(1); opacity: 0.9; }
  50% { transform: scaleY(1.14); opacity: 1; }
}
    .emb-float { animation: embFloat 4.0s ease-in-out infinite; }
    @keyframes embFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-12px) rotate(0.8deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: embTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes embTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  emb-flicker, emb-float, emb-shine, emb-tail, emb-wing-l, emb-wing-r, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f2f9ff"/>
  <circle cx="200" cy="206" r="172" fill="#e0f2fe"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#aedffa" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="emb-float">
<g class="emb-tail">
