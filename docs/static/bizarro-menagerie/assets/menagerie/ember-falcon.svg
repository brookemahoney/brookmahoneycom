<ellipse cx="200" cy="252" rx="62" ry="46" fill="#bae6fd" opacity="0.85"/>
<path d="M200,230 L214,241 L186,241 Z" fill="#fbbf24" stroke="#075985" stroke-width="3" stroke-linejoin="round"/>
<circle cx="158" cy="212" r="23" fill="#ffffff"/>
<circle cx="158" cy="212" r="14" fill="#0ea5e9"/>
<circle cx="158" cy="212" r="7" fill="#075985"/>
<circle class="emb-shine" cx="153" cy="206" r="5" fill="#ffffff"/>
<circle cx="242" cy="212" r="23" fill="#ffffff"/>
