<path d="M298,90 L324,112 L298,148 L272,112 Z" fill="#f0abfc" stroke="#5b21b6" stroke-width="3" stroke-linejoin="round"/><path d="M272,112 L324,112 M298,90 L288,112 L298,148 M298,90 L308,112 L298,148" fill="none" stroke="#5b21b6" stroke-width="2" opacity="0.5"/>
