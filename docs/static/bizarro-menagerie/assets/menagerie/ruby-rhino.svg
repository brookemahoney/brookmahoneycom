<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Ruby Rhino">
  <title>Bizarro Ruby Rhino</title>
  <desc>A bizarro cute ruby rhino floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .rub-shine { animation: rubShine 3.0s ease-in-out infinite; }
    @keyframes rubShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .rub-float { animation: rubFloat 4.2s ease-in-out infinite; }
    @keyframes rubFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-12px) rotate(1.0deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: rubTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes rubTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  rub-float, rub-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
  <circle cx="200" cy="206" r="172" fill="#ffe3fa"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#ffd0f4" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="rub-float">

<path d="M191,152 L200,100 L209,152 Z" fill="#ffffff" stroke="#5b21b6" stroke-width="3" stroke-linejoin="round"/>
<ellipse cx="200" cy="238" rx="98" ry="82" fill="#ff9ff3" stroke="#5b21b6" stroke-width="3"/>
<ellipse cx="200" cy="252" rx="62" ry="46" fill="#ffd6f7" opacity="0.85"/>
<circle cx="148" cy="212" r="27" fill="#ffffff"/>
<circle cx="148" cy="212" r="16" fill="#8b5cf6"/>
<circle cx="148" cy="212" r="8" fill="#5b21b6"/>
<circle class="rub-shine" cx="142" cy="206" r="5.5" fill="#ffffff"/>
<circle cx="252" cy="212" r="27" fill="#ffffff"/>
<circle cx="252" cy="212" r="16" fill="#8b5cf6"/>
<circle cx="252" cy="212" r="8" fill="#5b21b6"/>
<circle class="rub-shine" cx="246" cy="206" r="5.5" fill="#ffffff"/>
<ellipse cx="123" cy="238" rx="13" ry="8" fill="#f368e0" opacity="0.35"/>
<ellipse cx="277" cy="238" rx="13" ry="8" fill="#f368e0" opacity="0.35"/>
