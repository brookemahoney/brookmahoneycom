<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Robo Rabbit">
  <title>Bizarro Robo Rabbit</title>
  <desc>A bizarro cute robo rabbit glowing softly, with giant eyes and twinkling sparkles.</desc>
  <style>
    .rob-ear-twitch { animation: robEarTwitch 3.1s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    @keyframes robEarTwitch {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(4deg); }
}
    .rob-pulse { animation: robPulse 1.8s ease-in-out infinite; }
    @keyframes robPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
    .rob-arm-sway { animation: robArmSway 3.1s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes robArmSway {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(6deg); }
}
    .rob-shine { animation: robShine 3.0s ease-in-out infinite; }
    @keyframes robShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .rob-float { animation: robFloat 3.9s ease-in-out infinite; }
    @keyframes robFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(1.2deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: robTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes robTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  rob-arm-sway, rob-ear-twitch, rob-float, rob-pulse, rob-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f7f1ff"/>
  <circle cx="200" cy="206" r="172" fill="#eee2ff"/>
