<ellipse cx="277" cy="238" rx="13" ry="8" fill="#38bdf8" opacity="0.35"/>
<path d="M186,253 Q200,264 214,253" fill="none" stroke="#075985" stroke-width="3.5" stroke-linecap="round"/>
