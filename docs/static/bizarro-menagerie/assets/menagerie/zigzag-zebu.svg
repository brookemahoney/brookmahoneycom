<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Zigzag Zebu">
  <title>Bizarro Zigzag Zebu</title>
  <desc>A bizarro cute zigzag zebu floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .zig-shine { animation: zigShine 3.0s ease-in-out infinite; }
    @keyframes zigShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .zig-float { animation: zigFloat 3.9s ease-in-out infinite; }
    @keyframes zigFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-11px) rotate(1.0deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: zigTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes zigTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  twinkle, zig-float, zig-shine { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f2f9ff"/>
  <circle cx="200" cy="206" r="172" fill="#e0f2fe"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#aedffa" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="zig-float">
<ellipse cx="200" cy="170" rx="58" ry="30" fill="#38bdf8" stroke="#075985" stroke-width="3"/>

