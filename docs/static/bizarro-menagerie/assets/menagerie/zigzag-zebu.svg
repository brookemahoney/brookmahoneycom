<ellipse cx="200" cy="238" rx="98" ry="82" fill="#7dd3fc" stroke="#075985" stroke-width="3"/>
<path d="M130,200 L150,214 L170,200 L190,214 L210,200 L230,214 L250,200 L270,214" fill="none" stroke="#075985" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/><path d="M140,250 L160,264 L180,250 L200,264 L220,250 L240,264 L260,250" fill="none" stroke="#075985" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
