<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Unicycle Urchin">
  <title>Bizarro Unicycle Urchin</title>
  <desc>A bizarro cute unicycle urchin floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .uni-shine { animation: uniShine 3.0s ease-in-out infinite; }
    @keyframes uniShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .uni-float { animation: uniFloat 4.7s ease-in-out infinite; }
    @keyframes uniFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(0.7deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: uniTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes uniTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  twinkle, uni-float, uni-shine { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
