<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Satellite Seal">
  <title>Bizarro Satellite Seal</title>
  <desc>A bizarro cute satellite seal floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .sat-shine { animation: satShine 3.0s ease-in-out infinite; }
    @keyframes satShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .sat-flip-l { animation: satFlipL 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes satFlipL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(9deg); }
}
    .sat-flip-r { animation: satFlipR 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes satFlipR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-9deg); }
}
    .sat-float { animation: satFloat 4.2s ease-in-out infinite; }
    @keyframes satFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-7px) rotate(0.6deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: satTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes satTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  sat-flip-l, sat-flip-r, sat-float, sat-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f3f2ff"/>
  <circle cx="200" cy="206" r="172" fill="#e7e5ff"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#c9c5ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
<g class="sat-float">

<ellipse cx="200" cy="238" rx="98" ry="82" fill="#a5b4fc" stroke="#3730a3" stroke-width="3"/>
<ellipse cx="200" cy="252" rx="62" ry="46" fill="#c7d2fe" opacity="0.85"/>
<circle cx="148" cy="212" r="27" fill="#ffffff"/>
<circle cx="148" cy="212" r="16" fill="#6366f1"/>
<circle cx="148" cy="212" r="8" fill="#3730a3"/>
<circle class="sat-shine" cx="142" cy="206" r="5.5" fill="#ffffff"/>
<circle cx="252" cy="212" r="27" fill="#ffffff"/>
<circle cx="252" cy="212" r="16" fill="#6366f1"/>
<circle cx="252" cy="212" r="8" fill="#3730a3"/>
<circle class="sat-shine" cx="246" cy="206" r="5.5" fill="#ffffff"/>
