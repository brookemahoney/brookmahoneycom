<ellipse cx="277" cy="238" rx="13" ry="8" fill="#818cf8" opacity="0.35"/>
<path d="M186,253 Q200,264 214,253" fill="none" stroke="#3730a3" stroke-width="3.5" stroke-linecap="round"/>
<g class="sat-flip-l"><ellipse cx="138" cy="300" rx="15" ry="27" transform="rotate(28 138 300)" fill="#818cf8" stroke="#3730a3" stroke-width="3"/></g><g class="sat-flip-r"><ellipse cx="262" cy="300" rx="15" ry="27" transform="rotate(-28 262 300)" fill="#818cf8" stroke="#3730a3" stroke-width="3"/></g>
<ellipse cx="152" cy="318" rx="17" ry="9" fill="#818cf8" stroke="#3730a3" stroke-width="3"/><ellipse cx="248" cy="318" rx="17" ry="9" fill="#818cf8" stroke="#3730a3" stroke-width="3"/>
<path d="M96,72 A30,30 0 0 1 142,102" fill="none" stroke="#818cf8" stroke-width="9" stroke-linecap="round"/><line x1="119" y1="104" x2="119" y2="122" stroke="#3730a3" stroke-width="4"/><rect x="105" y="122" width="28" height="15" rx="5" fill="#a5b4fc" stroke="#3730a3" stroke-width="3"/><circle cx="119" cy="129" r="3" fill="#ffffff"/>
</g>
<g transform="translate(252,342) scale(1.15)"><path class="twinkle" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ffffff"/></g>
<g transform="translate(356,150) scale(0.95)"><path class="twinkle d1" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ff9ff3"/></g>
