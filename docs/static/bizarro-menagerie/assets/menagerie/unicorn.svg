<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro cute unicorn with swaying rainbow mane">
  <title>Bizarro Unicorn</title>
  <desc>A cute bizarro unicorn with a swaying five-band rainbow mane, giant eyes, and twinkling sparkles, floating gently.</desc>
  <style>
    .uni-float { animation: uniFloat 4s ease-in-out infinite; }
    @keyframes uniFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    .mane-sway {
      transform-box: fill-box;
      transform-origin: right center;
      animation: maneSway 2.9s ease-in-out infinite;
    }
    @keyframes maneSway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(7deg); }
    }
    .tail-sway {
      transform-box: fill-box;
      transform-origin: left center;
      animation: tailSway 3.4s ease-in-out infinite;
    }
    @keyframes tailSway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-10deg); }
    }
    .hoof-tap {
      transform-box: fill-box;
      transform-origin: center;
      animation: hoofTap 2.2s ease-in-out infinite;
    }
    @keyframes hoofTap {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }
    .eye-shine { animation: eyeShine 3s ease-in-out infinite; }
    @keyframes eyeShine {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .twinkle {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 2.6s ease-in-out infinite;
    }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -2s; }
    .twinkle.d4 { animation-delay: -1s; }
    @keyframes twinkle {
      0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
      50% { transform: scale(1.1) rotate(12deg); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .uni-float, .mane-sway, .tail-sway, .hoof-tap, .eye-shine, .twinkle { animation: none !important; }
    }
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
  <circle cx="200" cy="206" r="172" fill="#ffe3fa"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#ffd0f4" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
