<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Ice Cream Imp">
  <title>Bizarro Ice Cream Imp</title>
  <desc>A bizarro cute ice cream imp floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .ice-shine { animation: iceShine 3.0s ease-in-out infinite; }
    @keyframes iceShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .ice-float { animation: iceFloat 4.0s ease-in-out infinite; }
    @keyframes iceFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-12px) rotate(0.9deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: iceTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes iceTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  ice-float, ice-shine, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
  <circle cx="200" cy="206" r="172" fill="#ffe3fa"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#ffd0f4" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
