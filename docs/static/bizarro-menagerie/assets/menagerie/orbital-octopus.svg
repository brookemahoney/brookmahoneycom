<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Orbital Octopus">
  <title>Bizarro Orbital Octopus</title>
  <desc>A bizarro cute orbital octopus drifting in a sea of sparkle, with giant eyes and twinkling sparkles.</desc>
  <style>
    .orb-tent { animation: orbTent 3.0s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes orbTent {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(7deg); }
}
    .orb-shine { animation: orbShine 3.0s ease-in-out infinite; }
    @keyframes orbShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .orb-float { animation: orbFloat 4.5s ease-in-out infinite; }
    @keyframes orbFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-9px) rotate(0.8deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: orbTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes orbTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  orb-float, orb-shine, orb-tent, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f3f2ff"/>
