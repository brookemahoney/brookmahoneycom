<circle cx="242" cy="212" r="14" fill="#eab308"/>
<circle cx="242" cy="212" r="7" fill="#713f12"/>
<circle class="nac-shine" cx="237" cy="206" r="5" fill="#ffffff"/>
<ellipse cx="137" cy="238" rx="13" ry="8" fill="#facc15" opacity="0.35"/>
<ellipse cx="263" cy="238" rx="13" ry="8" fill="#facc15" opacity="0.35"/>
<path d="M186,249 Q200,260 214,249" fill="none" stroke="#713f12" stroke-width="3.5" stroke-linecap="round"/>
