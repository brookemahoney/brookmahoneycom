<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Nacho Nightingale">
  <title>Bizarro Nacho Nightingale</title>
  <desc>A bizarro cute nacho nightingale bobbing among sparkles, with giant eyes and twinkling sparkles.</desc>
  <style>
    .nac-tail { animation: nacTail 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes nacTail {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(6deg); }
}
    .nac-wing-l { animation: nacWingL 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    @keyframes nacWingL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-13deg); }
}
    .nac-wing-r { animation: nacWingR 2.0s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes nacWingR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(13deg); }
}
    .nac-shine { animation: nacShine 3.0s ease-in-out infinite; }
    @keyframes nacShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .nac-float { animation: nacFloat 4.1s ease-in-out infinite; }
    @keyframes nacFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-7px) rotate(0.6deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: nacTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes nacTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  nac-float, nac-shine, nac-tail, nac-wing-l, nac-wing-r, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fffdf4"/>
  <circle cx="200" cy="206" r="172" fill="#fef6d8"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#f5e3a8" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
