<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Disco Dino">
  <title>Bizarro Disco Dino</title>
  <desc>A bizarro cute disco dino floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .dis-shine { animation: disShine 3.0s ease-in-out infinite; }
    @keyframes disShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .dis-spin { animation: disSpin 5.5s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes disSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
    .dis-float { animation: disFloat 4.1s ease-in-out infinite; }
    @keyframes disFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-13px) rotate(0.8deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: disTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes disTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  dis-float, dis-shine, dis-spin, twinkle { animation: none !important; }
}
  </style>
