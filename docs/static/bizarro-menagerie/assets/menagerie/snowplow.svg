<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro cute snowplow chugging with a sparkle trail">
  <title>Bizarro Snowplow</title>
  <desc>A giant-eyed bizarro snowplow with a pink blade, wobbling as it chugs along, trailing twinkling sparkle puffs.</desc>
  <style>
    .plow-chug { animation: plowChug 1.6s ease-in-out infinite; }
    @keyframes plowChug {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-3px) rotate(-1.4deg); }
      75% { transform: translateY(2px) rotate(1.4deg); }
    }
    .wheel-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheelSpin 2.4s linear infinite;
    }
    @keyframes wheelSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .puff {
      transform-box: fill-box;
      transform-origin: center;
      animation: puffTrail 2.2s ease-in-out infinite;
    }
    .puff.d1 { animation-delay: -0.7s; }
    .puff.d2 { animation-delay: -1.4s; }
    @keyframes puffTrail {
      0%, 100% { transform: translate(0,0) scale(0.7); opacity: 0.35; }
      50% { transform: translate(-14px,-10px) scale(1.05); opacity: 0.9; }
    }
    .eye-shine { animation: eyeShine 3s ease-in-out infinite; }
    @keyframes eyeShine {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .twinkle {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 2.6s ease-in-out infinite;
    }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.5s; }
    .twinkle.d3 { animation-delay: -2.1s; }
    @keyframes twinkle {
      0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
      50% { transform: scale(1.1) rotate(12deg); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .plow-chug, .wheel-spin, .puff, .eye-shine, .twinkle { animation: none !important; }
    }
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
  <circle cx="200" cy="206" r="172" fill="#ffe3fa"/>
  <path d="M60,318 Q200,306 340,318" fill="none" stroke="#e9d5ff" stroke-width="10" stroke-linecap="round"/>
  <g class="puff" transform="translate(56,238)"><path d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ffffff"/></g>
  <g class="puff d1" transform="translate(34,262) scale(0.8)"><path d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#c8a2ff"/></g>
  <g class="puff d2" transform="translate(20,286) scale(0.65)"><path d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ff9ff3"/></g>
  <g class="plow-chug">
    <path d="M96,196 C70,206 58,232 66,254 C74,276 100,282 118,270 C136,258 140,236 132,216 Z" fill="#ff9ff3"/>
    <path d="M104,210 C88,218 82,236 88,250 C94,262 110,266 120,258 C130,250 132,236 126,222 Z" fill="#f368e0" opacity="0.45"/>
    <rect x="118" y="120" width="150" height="104" rx="30" fill="#8b5cf6"/>
    <rect x="118" y="120" width="150" height="104" rx="30" fill="none" stroke="#5b21b6" stroke-width="4"/>
    <path d="M268,140 C300,150 314,178 308,206 C302,234 280,248 256,242 L256,168 Z" fill="#c8a2ff"/>
    <path d="M262,148 C288,156 298,178 293,200 C288,222 272,232 256,228 L256,168 Z" fill="#e9d5ff" opacity="0.6"/>
    <circle cx="172" cy="160" r="24" fill="#ffffff"/>
    <circle cx="172" cy="160" r="13.5" fill="#8b5cf6"/>
    <circle cx="172" cy="160" r="6.5" fill="#5b21b6"/>
    <circle class="eye-shine" cx="165" cy="153" r="5" fill="#ffffff"/>
    <circle cx="222" cy="160" r="24" fill="#ffffff"/>
    <circle cx="222" cy="160" r="13.5" fill="#8b5cf6"/>
    <circle cx="222" cy="160" r="6.5" fill="#5b21b6"/>
    <circle class="eye-shine" cx="215" cy="153" r="5" fill="#ffffff"/>
    <path d="M186,192 Q197,187 208,192 Q205,201 197,202 Q189,201 186,192 Z" fill="#f368e0"/>
    <path d="M182,206 Q189,211 197,207 Q205,211 212,206" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <rect x="140" y="224" width="112" height="34" rx="16" fill="#5b21b6"/>
    <g class="wheel-spin">
      <circle cx="158" cy="272" r="26" fill="#5b21b6"/>
      <circle cx="158" cy="272" r="18" fill="#c8a2ff"/>
      <circle cx="158" cy="272" r="8" fill="#5b21b6"/>
      <path d="M158,254 L158,290 M140,272 L176,272" stroke="#e9d5ff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g class="wheel-spin">
      <circle cx="238" cy="272" r="26" fill="#5b21b6"/>
      <circle cx="238" cy="272" r="18" fill="#c8a2ff"/>
      <circle cx="238" cy="272" r="8" fill="#5b21b6"/>
      <path d="M238,254 L238,290 M220,272 L256,272" stroke="#e9d5ff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <rect x="282" y="150" width="14" height="40" rx="7" fill="#f368e0"/>
    <circle cx="289" cy="142" r="9" fill="#ff9ff3"/>
  </g>
  <g transform="translate(62,92) scale(1.1)"><path class="twinkle" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ffffff"/></g>
  <g transform="translate(338,76) scale(0.95)"><path class="twinkle d1" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#c8a2ff"/></g>
  <g transform="translate(346,300) scale(1)"><path class="twinkle d2" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ff9ff3"/></g>
  <g transform="translate(120,60) scale(0.75)"><path class="twinkle d3" d="M0,-14 C2,-4 4,-2 14,0 C4,2 2,4 0,14 C-2,4 -4,2 -14,0 C-4,-2 -2,-4 0,-14 Z" fill="#ffffff"/></g>
</svg>
