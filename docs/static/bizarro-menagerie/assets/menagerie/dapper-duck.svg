<ellipse cx="200" cy="246" rx="88" ry="70" fill="#6ee7b7" stroke="#065f46" stroke-width="3"/>
<ellipse cx="200" cy="252" rx="62" ry="46" fill="#a7f3d0" opacity="0.85"/>
