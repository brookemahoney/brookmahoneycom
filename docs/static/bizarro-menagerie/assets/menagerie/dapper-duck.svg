<circle cx="158" cy="212" r="23" fill="#ffffff"/>
<circle cx="158" cy="212" r="14" fill="#10b981"/>
<circle cx="158" cy="212" r="7" fill="#065f46"/>
<circle class="dap-shine" cx="153" cy="206" r="5" fill="#ffffff"/>
<circle cx="242" cy="212" r="23" fill="#ffffff"/>
<circle cx="242" cy="212" r="14" fill="#10b981"/>
<circle cx="242" cy="212" r="7" fill="#065f46"/>
<circle class="dap-shine" cx="237" cy="206" r="5" fill="#ffffff"/>
<ellipse cx="137" cy="238" rx="13" ry="8" fill="#34d399" opacity="0.35"/>
<ellipse cx="263" cy="238" rx="13" ry="8" fill="#34d399" opacity="0.35"/>
<path d="M186,249 Q200,260 214,249" fill="none" stroke="#065f46" stroke-width="3.5" stroke-linecap="round"/>
