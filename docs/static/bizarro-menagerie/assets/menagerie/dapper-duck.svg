<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Dapper Duck">
  <title>Bizarro Dapper Duck</title>
  <desc>A bizarro cute dapper duck bobbing among sparkles, with giant eyes and twinkling sparkles.</desc>
  <style>
    .dap-tail { animation: dapTail 2.9s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes dapTail {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(6deg); }
}
    .dap-wing-l { animation: dapWingL 2.1s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    @keyframes dapWingL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-13deg); }
}
    .dap-wing-r { animation: dapWingR 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes dapWingR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(13deg); }
}
    .dap-shine { animation: dapShine 3.0s ease-in-out infinite; }
    @keyframes dapShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .dap-float { animation: dapFloat 4.1s ease-in-out infinite; }
    @keyframes dapFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-7px) rotate(1.3deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: dapTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes dapTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  dap-float, dap-shine, dap-tail, dap-wing-l, dap-wing-r, twinkle { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#f2fdf8"/>
  <circle cx="200" cy="206" r="172" fill="#dcf7ec"/>
  <circle cx="200" cy="206" r="172" fill="none" stroke="#b3e9cf" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 12"/>
