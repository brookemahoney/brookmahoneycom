<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Tangerine Turkey">
  <title>Bizarro Tangerine Turkey</title>
  <desc>A bizarro cute tangerine turkey bobbing among sparkles, with giant eyes and twinkling sparkles.</desc>
  <style>
    .tan-wing-l { animation: tanWingL 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
    @keyframes tanWingL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-13deg); }
}
    .tan-wing-r { animation: tanWingR 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes tanWingR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(13deg); }
}
    .tan-shine { animation: tanShine 3.0s ease-in-out infinite; }
    @keyframes tanShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .tan-float { animation: tanFloat 4.2s ease-in-out infinite; }
    @keyframes tanFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-9px) rotate(1.2deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: tanTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes tanTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  tan-float, tan-shine, tan-wing-l, tan-wing-r, twinkle { animation: none !important; }
}
  </style>
