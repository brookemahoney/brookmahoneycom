<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Bizarro Xylophone Xerus">
  <title>Bizarro Xylophone Xerus</title>
  <desc>A bizarro cute xylophone xerus floating gently, with giant eyes and twinkling sparkles.</desc>
  <style>
    .xyl-tail { animation: xylTail 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes xylTail {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-11deg); }
}
    .xyl-shine { animation: xylShine 3.0s ease-in-out infinite; }
    @keyframes xylShine {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
    .xyl-float { animation: xylFloat 3.6s ease-in-out infinite; }
    @keyframes xylFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(0.6deg); }
}
    .twinkle { transform-box: fill-box; transform-origin: center; animation: xylTwinkle 2.6s ease-in-out infinite; }
    .twinkle.d1 { animation-delay: -0.6s; }
    .twinkle.d2 { animation-delay: -1.3s; }
    .twinkle.d3 { animation-delay: -1.9s; }
    .twinkle.d4 { animation-delay: -2.4s; }
    .twinkle.d5 { animation-delay: -0.9s; }
    @keyframes xylTwinkle {
  0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.3; }
  50% { transform: scale(1.15) rotate(12deg); opacity: 1; }
}
    @media (prefers-reduced-motion: reduce) {
  twinkle, xyl-float, xyl-shine, xyl-tail { animation: none !important; }
}
  </style>
  <rect width="400" height="400" fill="#fff3fc"/>
