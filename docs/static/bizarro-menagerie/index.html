<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Bizarro Menagerie</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <svg class="sparkle-motif" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/>
    </svg>
    <h1>The Bizarro Menagerie</h1>
    <svg class="sparkle-motif" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/>
    </svg>
  </header>

  <main>
    <div style="text-align:center; margin: 1rem 1rem 1rem;" aria-label="Shuffle control">
      <button id="changeroo-btn" type="button" style="font-family: inherit; font-size: 1.1rem; padding: 0.6rem 1.2rem; border: 2px solid var(--pink-deep); border-radius: 999px; background: var(--sparkle); color: var(--purple-deep); font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgb(91 33 182 / .2);">Changeroo!</button>
    </div>

    <div class="divider" aria-hidden="true">
      <svg class="sparkle-motif" viewBox="0 0 24 24" focusable="false">
        <path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/>
      </svg>
      <svg class="sparkle-motif sparkle-motif--small" viewBox="0 0 24 24" focusable="false">
        <path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/>
      </svg>
      <svg class="sparkle-motif" viewBox="0 0 24 24" focusable="false">
        <path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/>
      </svg>
    </div>

    <section class="gallery" aria-label="The Wonder Grid">
      <div class="gallery-grid">
                <figure class="gallery-slot" data-index="0" tabindex="0" role="button" aria-label="Swap Bizarro Astral Anteater for another creation">
          <img src="assets/menagerie/astral-anteater.svg" alt="Bizarro Astral Anteater" width="400" height="400">
          <figcaption>Astral Anteater</figcaption>
        </figure>
                <figure class="gallery-slot" data-index="1" tabindex="0" role="button" aria-label="Swap Bizarro Astronaut Axolotl for another creation">
          <img src="assets/menagerie/astronaut-axolotl.svg" alt="Bizarro Astronaut Axolotl" width="400" height="400">
          <figcaption>Astronaut Axolotl</figcaption>
        </figure>
                <figure class="gallery-slot" data-index="2" tabindex="0" role="button" aria-label="Swap Bizarro Banana Bat for another creation">
          <img src="assets/menagerie/banana-bat.svg" alt="Bizarro Banana Bat" width="400" height="400">
          <figcaption>Banana Bat</figcaption>
        </figure>
                <figure class="gallery-slot" data-index="3" tabindex="0" role="button" aria-label="Swap Bizarro Bubble Bee for another creation">
          <img src="assets/menagerie/bubble-bee.svg" alt="Bizarro Bubble Bee" width="400" height="400">
          <figcaption>Bubble Bee</figcaption>
        </figure>
                <figure class="gallery-slot" data-index="4" tabindex="0" role="button" aria-label="Swap Bizarro Bubblegum Bear for another creation">
          <img src="assets/menagerie/bubblegum-bear.svg" alt="Bizarro Bubblegum Bear" width="400" height="400">
          <figcaption>Bubblegum Bear</figcaption>
        </figure>
                <figure class="gallery-slot" data-index="5" tabindex="0" role="button" aria-label="Swap Bizarro Candy Caterpillar for another creation">
          <img src="assets/menagerie/candy-caterpillar.svg" alt="Bizarro Candy Caterpillar" width="400" height="400">
          <figcaption>Candy Caterpillar</figcaption>
        </figure>
                <figure class="gallery-slot" data-index="6" tabindex="0" role="button" aria-label="Swap Bizarro Cat for another creation">
          <img src="assets/menagerie/cat.svg" alt="Bizarro Cat" width="400" height="400">
          <figcaption>Cat</figcaption>
        </figure>
                <figure class="gallery-slot" data-index="7" tabindex="0" role="button" aria-label="Swap Bizarro Churro Cheetah for another creation">
          <img src="assets/menagerie/churro-cheetah.svg" alt="Bizarro Churro Cheetah" width="400" height="400">
          <figcaption>Churro Cheetah</figcaption>
        </figure>
                <figure class="gallery-slot" data-index="8" tabindex="0" role="button" aria-label="Swap Bizarro Cinnamon Cow for another creation">
          <img src="assets/menagerie/cinnamon-cow.svg" alt="Bizarro Cinnamon Cow" width="400" height="400">
          <figcaption>Cinnamon Cow</figcaption>
        </figure>
              </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="divider" aria-hidden="true">
      <svg class="sparkle-motif" viewBox="0 0 24 24" focusable="false">
        <path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/>
      </svg>
    </div>
    <p>Powered by Sparkles.</p>
  </footer>

  <script src="assets/menagerie-manifest.js"></script>
  <script src="assets/interactions.js" defer></script>
  <script src="assets/shuffle.js" defer></script>
</body>
</html>
