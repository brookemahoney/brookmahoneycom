<script>
  (function() {
    var isReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (isReduced) return;

    var isHover = window.matchMedia('(hover: hover)').matches;
    if (!isHover) return;

    var group = document.getElementById('portrait-group');
    if (!group) return;

    var maxTilt = 5;
    var dampen = 0.3;
    var targetX = 0, targetY = 0;
    var currentX = 0, currentY = 0;

    document.addEventListener('mousemove', function(e) {
      targetX = ((e.clientY / window.innerHeight) - 0.5) * 2;
      targetY = ((e.clientX / window.innerWidth) - 0.5) * 2;
    });

    function animate() {
      currentX += (targetX - currentX) * 0.1;
      currentY += (targetY - currentY) * 0.1;
      var rotateX = currentX * maxTilt * dampen;
      var rotateY = -currentY * maxTilt * dampen;
      group.style.transform = 'rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg)';
      requestAnimationFrame(animate);
    }
    animate();
  })();
</script>
