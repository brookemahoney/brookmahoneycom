name: Brooke's Theme 2
type: theme
'base theme': false
version: 1.0.0
libraries:
  - brooketheme2/base
  - brooketheme2/messages
  - core/normalize
libraries-extend:
  user/drupal.user:
    - brooketheme2/user
  core/drupal.dropbutton:
    - brooketheme2/dropbutton
  core/drupal.dialog:
    - brooketheme2/dialog
  file/drupal.file:
    - brooketheme2/file
  core/drupal.item-list:
    - brooketheme2/item-list
  core/drupal.progress:
    - brooketheme2/progress
  core/drupal.tablesort:
    - brooketheme2/drupal.tablesort
description: 'A theme for brookemahoney.com'
core_version_requirement: ^11
generator: 'starterkit_theme:11.4.11'
regions:
  header: Header
  primary_menu: Primary menu
  secondary_menu: Secondary menu
  highlighted: Highlighted
  breadcrumb: Breadcrumb
  content: Content
  footer: Footer
